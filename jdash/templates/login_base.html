{% load static %}
{% load custom_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JDash</title>

    <!-- Static Files -->
    <link type="text/css" href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css">
    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/jquery.slin.min.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>

<body class="d-flex flex-column min-vh-100">
    {% include "brand_nav.html" with request=request %}

    <div class="flex-grow-1">
        {% block content %}
        {% endblock %}
    </div>
    <script>
        function buildLanguageSwitchPath(targetLang) {
            const url = new URL(window.location.href);
            let path = url.pathname;

            if (/^\/dev\/(en|de)(\/|$)/.test(path)) {
                return path.replace(/^\/dev\/(en|de)(?=\/|$)/, `/dev/${targetLang}`) + url.search + url.hash;
            } else if (/^\/(en|de)(\/|$)/.test(path)) {
                path = path.replace(/^\/(en|de)(?=\/|$)/, "");
            } else if (/^\/(en|de)\/dev(\/|$)/.test(path)) {
                path = path.replace(/^\/(en|de)\/dev(?=\/|$)/, "/dev");
            }

            if (!path.startsWith("/")) {
                path = `/${path}`;
            }
            if (path === "") {
                path = "/";
            }

            return `/${targetLang}${path}${url.search}${url.hash}`;
        }

        document.querySelectorAll(".language-link").forEach((link) => {
            link.href = buildLanguageSwitchPath(link.dataset.language);
        });
    </script>
</body>
</html>
