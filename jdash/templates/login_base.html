{% load static %}
{% load custom_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JDash</title>

    <!-- Static Files -->
    <link type="text/css" href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css">
    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/jquery.slin.min.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>

<body class="branding-page d-flex flex-column min-vh-100">
    {% include "brand_nav.html" with request=request %}
    {% include "includes/message_popups.html" %}

    <div class="branding-main flex-grow-1">
        {% block content %}
        {% endblock %}
        {% block partners %}
        {% endblock %}
    </div>
    {% block page_scripts %}
    {% endblock %}
    <script src="{% static 'js/language_switcher.js' %}"></script>
    <script src="{% static 'js/required-field-markers.js' %}"></script>
</body>
</html>
