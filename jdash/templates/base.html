{% load static %}
{% load custom_tags %}
<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>JDash</title>
		<link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet"  crossorigin="anonymous">
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css">
        <script src="{% static 'js/jquery.min.js' %}"></script>
        <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
        <script src="{% static 'js/jquery.slin.min.js' %}"></script>
        <link type="text/css" rel="stylesheet" href="{% static 'css/style.css' %}" />
	</head>
	<body class="dashboard-body">
		<script>
			(function () {
				try {
					if (window.matchMedia("(min-width: 992px)").matches &&
						window.localStorage.getItem("jdash-sidebar-collapsed") === "true") {
						document.body.classList.add("dashboard-sidebar-collapsed");
					}
				} catch (error) {
					// Continue with the expanded sidebar when storage is unavailable.
				}
			})();
		</script>
		{% include "nav.html" with request=request %}
		{% include "includes/message_popups.html" %}
		<button type="button" class="dashboard-sidebar-mobile-toggle" id="dashboardSidebarMobileToggle" aria-controls="dashboardSidebar" aria-expanded="false" aria-label="Open navigation">
			<i class="fas fa-bars" aria-hidden="true"></i>
		</button>
		<div class="dashboard-shell">
			{% include "sidebar.html" with request=request %}
	        <div class="container-fluid dashboard-content" >
	            {% block content %}
	            {% endblock %}
	        </div>
		</div>
		<div class="dashboard-sidebar-backdrop" id="dashboardSidebarBackdrop"></div>
	        <script src="{% static 'js/language_switcher.js' %}"></script>
	        <script src="{% static 'js/required-field-markers.js' %}"></script>
	        <script src="{% static 'js/sidebar.js' %}"></script>
	    </body>
    
</html>
