{% load i18n %}
<style>
    .jdash-red-loading-overlay {
      --panel-red: #ef8184;
      --stroke: #0b628d;
      box-sizing: border-box;
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: rgba(248, 250, 252, 0.82);
      font-family: Arial, sans-serif;
    }

    .jdash-red-loading-overlay[hidden] {
      display: none;
    }

    .jdash-red-loading-overlay .loader-wrap {
      width: 104px;
      height: 104px;
      display: grid;
      place-items: center;
      transform: translateY(36px);
    }

    /* Keep the colored logo and blue outline, without an outer shadow. */
    .jdash-red-loading-overlay .center-tile {
      width: 84px;
      height: 84px;
      background: var(--panel-red);
      border: 3px solid var(--stroke);
      border-radius: 12px;
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Only the inner icon animates: fades and moves left to right */
    .jdash-red-loading-overlay .center-icon {
      width: 56px;
      height: auto;
      opacity: 1;
      filter: none !important;
      mix-blend-mode: normal;
      forced-color-adjust: none;
      animation: fadeSlide 1.8s ease-in-out infinite;
      will-change: transform, opacity;
    }

    @keyframes fadeSlide {
      0% {
        opacity: 0;
        transform: translateX(-24px);
      }
      18% {
        opacity: 1;
        transform: translateX(-8px);
      }
      50% {
        opacity: 1;
        transform: translateX(0);
      }
      82% {
        opacity: 1;
        transform: translateX(10px);
      }
      100% {
        opacity: 0;
        transform: translateX(24px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .jdash-red-loading-overlay .center-icon {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>
